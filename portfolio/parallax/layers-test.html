<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layers Test · 石柱穿越神像</title>
<style>
  /* === 全局：和 parallax 项目保持同一套底色与字体 === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0806;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    height: 100%;
    overflow-x: clip;
  }

  /* === 顶部导航：保持原 parallax 的样子 === */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    color: #fff;
  }
  .nav-logo { font-size: 16px; font-weight: 700; letter-spacing: 0.2em; }
  .nav-menu { display: flex; gap: 32px; font-size: 12px; letter-spacing: 0.15em; opacity: 0.85; }
  .nav-menu a { color: #fff; text-decoration: none; cursor: pointer; }
  .nav-menu a:hover { color: #d4b06a; }

  /* === 舞台：占满视口，三层图全部绝对定位叠在 100vh 上 === */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* z-index 顺序：
     1=背景  2=神像  3=石柱（最上层，能挡住神像） */
  #layer-bg     { z-index: 1; }
  #layer-angel  { z-index: 2; }
  #layer-pillar { z-index: 3; }

  /* === 调试提示（不是装饰效果，只是切换工具） === */
  .hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    font-size: 11px;
    color: #d4b06a;
    letter-spacing: 0.32em;
    opacity: 0.75;
    z-index: 20;
    background: rgba(0,0,0,0.35);
    padding: 8px 18px;
    border-radius: 2px;
  }
  .hint kbd {
    display: inline-block;
    min-width: 22px;
    padding: 2px 6px;
    margin: 0 2px;
    border: 1px solid rgba(212,176,106,0.5);
    border-radius: 3px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #d4b06a;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">AYI · 阿意</div>
  <div class="nav-menu">
    <a href="index.html">← 返回 Parallax</a>
    <a href="layers-preview.png" target="_blank">合成图</a>
  </div>
</nav>

<div class="stage" id="stage">
  <!-- 三层透明 PNG，按 z-index 叠放。
       默认全开：背景 < 神像 < 石柱（石柱在最上层，能挡住神像） -->
  <img class="layer" id="layer-bg"     src="layer-bg.png"     alt="背景">
  <img class="layer" id="layer-angel"  src="layer-angel.png"  alt="神像">
  <img class="layer" id="layer-pillar" src="layer-pillar.png" alt="石柱">
</div>

<div class="hint">
  按 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 开关图层 · <kbd>0</kbd> 全开
  &nbsp;|&nbsp;
  1=背景 2=神像 3=石柱
</div>

<script>
  // 仅作调试工具：单独显示某一层，方便检查抠图边界 / 验证前后关系。
  // 不算"CSS 效果"。
  const map = { '1': 'bg', '2': 'angel', '3': 'pillar' };
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === '0') {
      Object.values(map).forEach(n => {
        document.getElementById('layer-' + n).style.display = 'block';
      });
    } else if (map[k]) {
      const el = document.getElementById('layer-' + map[k]);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
  });
</script>

</body>
</html>
