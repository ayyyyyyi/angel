<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom Parallax · 石柱让开 神像接近</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0806;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;           /* 关键：页面本身不滚动，滚动交给 wheel 事件驱动 */
    height: 100%;
  }

  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    color: #fff;
  }
  .nav-logo { font-size: 16px; font-weight: 700; letter-spacing: 0.2em; }
  .nav-menu { display: flex; gap: 32px; font-size: 12px; letter-spacing: 0.15em; opacity: 0.85; }
  .nav-menu a { color: #fff; text-decoration: none; cursor: pointer; }
  .nav-menu a:hover { color: #d4b06a; }

  .layer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    will-change: transform;
  }

  #layer-bg     { z-index: 1; transform-origin: center center; }

  #layer-angel  {
    z-index: 2;
    transform-origin: 50% 38%;   /* 脸部位置：放大中心钉在神像脸上，scale 时脸部不动，周围推到屏外 */
  }

  /* 石柱：整张图从中心放大 -> 柱子往两侧让开，神像从中穿过 */
  #layer-pillar {
    z-index: 3;
    transform-origin: center center;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    font-size: 11px;
    color: #d4b06a;
    letter-spacing: 0.32em;
    opacity: 0.75;
    z-index: 20;
    background: rgba(0,0,0,0.35);
    padding: 8px 18px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .hint kbd {
    display: inline-block;
    min-width: 22px;
    padding: 2px 6px;
    margin: 0 2px;
    border: 1px solid rgba(212,176,106,0.5);
    border-radius: 3px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #d4b06a;
  }

  /* 底部进度条：直观看到"推进到哪了"，也可以直接点/拖 */
  .progress-track {
    position: fixed;
    left: 50%;
    bottom: 78px;
    transform: translateX(-50%);
    width: min(420px, 60vw);
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    z-index: 20;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #d4b06a;
    border-radius: 2px;
    transition: none;
  }
  .progress-label {
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.35em;
    color: #d4b06a;
    opacity: 0.85;
    z-index: 20;
  }

  /* ===== 转场后的视频画面（素材还没做，先占位） ===== */
  .video-scene {
    position: fixed; inset: 0;
    z-index: 7;                    /* 卡片(8)下方、神像(2)上方 */
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(70,58,40,0.25), rgba(5,4,3,0.95) 70%),
      #050403;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .video-scene.show { opacity: 1; pointer-events: auto; }
  .video-scene video { width: 100%; height: 100%; object-fit: cover; }
  .video-ph {
    text-align: center;
    font-size: 46px;
    line-height: 1;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.12em;
  }
  .video-ph span {
    display: block; margin-top: 18px;
    font-size: 13px; letter-spacing: 0.45em;
    color: rgba(255,255,255,0.38);
  }

  /* ===== 横排一字卡（米色调，仿"FALL INTO REVERIE"参考图） ===== */
  .cards-stage {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 0; height: 0;
    z-index: 8;                 /* 高于三层图(1/2/3)和视频场景(7)，低于导航(10)和进度条(20) */
    pointer-events: none;
  }
  .card {
    position: absolute;
    left: 0; top: 0;
    width: 220px;
    height: 290px;
    margin-left: -110px;        /* 让 (0,0) 对齐卡片中心 */
    margin-top: -145px;
    border-radius: 16px;
    cursor: pointer;
    pointer-events: auto;
    padding: 26px 24px;
    /* 米色主调：上方稍亮（光源从上来），下方稍深一档做厚度感 */
    background: linear-gradient(165deg, #e7d4b3 0%, #dac4a3 65%, #cfb88f 100%);
    box-shadow:
      0 22px 50px rgba(0,0,0,0.55),
      0 6px 14px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.28);    /* 顶上一抹高光 */
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
    will-change: transform, opacity;
    overflow: visible;
  }
  .card:hover {
    /* hover 时原位浮起，最直接的交互反馈 */
    box-shadow:
      0 30px 70px rgba(0,0,0,0.68),
      0 8px 20px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.32);
  }
  /* 编号小圆圈（右上角） */
  .card-num {
    position: absolute;
    top: 16px; right: 16px;
    width: 34px; height: 34px;
    border: 1px solid rgba(58, 42, 26, 0.35);
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #3a2a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 标题：衬线大字号，米色调深棕色，复古杂志风 */
  .card-title {
    margin-top: 64px;
    font-family: Georgia, 'Playfair Display', 'Times New Roman', serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: 0.005em;
    color: #2b1f12;
  }
  /* 描述：小字、柔软一点 */
  .card-desc {
    margin-top: 14px;
    font-size: 12.5px;
    line-height: 1.6;
    color: rgba(43, 31, 18, 0.70);
    letter-spacing: 0.01em;
  }
  /* 激活态：中央卡（或 hover 卡）出现 ▶ */
  .card-play {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    display: flex;
    align-items: center; justify-content: center;
    font-size: 22px;
    color: #2b1f12;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.16,1,0.3,1);
    pointer-events: none;
  }
  .card.playing .card-play {
    opacity: 1;
  }
  /* 激活态加强（不要用 !important transform，会覆盖 JS 算的位移） */
  .card.playing {
    /* 阴影更深、更显眼 */
    box-shadow:
      0 32px 78px rgba(0,0,0,0.72),
      0 10px 22px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.36);
  }
  /* 鼠标悬浮时也显示 ▶（更直观） */
  .card:hover .card-play {
    opacity: 1;
  }

  /* ===== 卡片详情浮层 ===== */
  .card-overlay {
    position: fixed; inset: 0;
    z-index: 30;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .card-overlay.show { opacity: 1; pointer-events: auto; }
  .card-overlay-panel {
    width: min(680px, 88vw);
    border-radius: 20px;
    border: 1px solid rgba(212,176,106,0.4);
    background: linear-gradient(160deg, rgba(28,23,16,0.96), rgba(12,10,7,0.92));
    padding: 44px;
    color: #fff;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  .card-overlay.show .card-overlay-panel { transform: translateY(0) scale(1); }
  .card-overlay-close {
    position: absolute; top: 16px; right: 20px;
    font-size: 22px; line-height: 1;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
  }
  .card-overlay-close:hover { color: #d4b06a; }
  /* 详情浮层顶部的圆形编号徽标（仿卡上编号样式，但更大更显眼） */
  .card-overlay-num {
    width: 56px; height: 56px;
    border: 1px solid rgba(212,176,106,0.5);
    border-radius: 50%;
    background: rgba(212,176,106,0.10);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px;
    color: #d4b06a;
    display: flex;
    align-items: center; justify-content: center;
    letter-spacing: 0.05em;
  }
  .card-overlay-title { margin-top: 16px; font-size: 30px; font-weight: 700; letter-spacing: 0.02em; }
  .card-overlay-tag { margin-top: 6px; font-size: 11px; letter-spacing: 0.28em; color: #d4b06a; }
  .card-overlay-desc { margin-top: 22px; font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.78); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">AYI · 阿意</div>
  <div class="nav-menu">
    <a href="layers-test.html">← 静态版</a>
    <a href="layers-preview.png" target="_blank">合成图</a>
  </div>
</nav>

<!-- 背景层：静态雪山图（保持原样） -->
<img class="layer" id="layer-bg"     src="layer-bg.png"     alt="背景">
<img class="layer" id="layer-angel"  src="layer-angel.png"  alt="神像">
<img class="layer" id="layer-pillar" src="layer-pillar.png" alt="石柱">

<div class="progress-label" id="stage-label">远景 · 雪山撑场</div>
<div class="progress-track" id="progress-track">
  <div class="progress-fill" id="progress-fill"></div>
</div>

<!-- 转场后的视频画面：素材做好后，把下面占位换成 <video src="xxx.mp4" autoplay muted playsinline></video> -->
<div class="video-scene" id="video-scene">
  <div class="video-ph">🎬<span>视频画面 · 待定</span></div>
</div>

<div class="cards-stage" id="cards-stage"></div>

<div class="card-overlay" id="card-overlay">
  <div class="card-overlay-panel">
    <div class="card-overlay-close" id="overlay-close">✕</div>
<div class="card-overlay-num" id="ov-emoji"></div>
  <div class="card-overlay-title" id="ov-title"></div>
    <div class="card-overlay-tag" id="ov-tag"></div>
    <div class="card-overlay-desc" id="ov-desc"></div>
  </div>
</div>

<div class="hint">
  滚轮当油门 · 按住鼠标上下拖也行 &nbsp;|&nbsp; 按 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 开关图层 · <kbd>0</kbd> 全开
</div>

<script>
  // ============ 缓动曲线（变速推进的关键） ============
  // 关键：纯"先慢后快"（easeIn）结尾斜率最大，会"越滚越猛+结尾急刹"，视觉上不丝滑。
  // 换成"缓入缓出"S 曲线（先慢→中快→结尾收住）后，全程平滑，没有猛冲急停的顿挫。
  const EASING = {
    linear:    t => t,
    easeIn:    t => t * t * t,                              // 纯先慢后快：结尾最猛，容易"急刹"（不丝滑，留作对比）
    easeInQuad:t => t * t,                                  // 平方版"先慢后快"
    easeOut:   t => 1 - Math.pow(1 - t, 3),                 // 先快后慢（一般不用，留作反向）
    easeInOut: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,  // 缓入缓出立方：慢→快→慢，全程丝滑
    smoothstep:t => t * t * (3 - 2 * t)                     // 更柔和的 S 曲线（两端斜率都归零，最丝滑）
  };

  // ============ 推镜头：分段驱动 ============
  // 每个图层有自己的变化区间 [start, end] + 缓动曲线 ease，在区间内从 from 放大到 to
  // 节奏：石柱先起步，神像晚一点点跟上（几乎同步），两者并行推到结尾，速度都是"先慢后快"
  const zoomRange = {
    bg:     { from: 1.00, to: 1.10, start: 0.00, end: 1.00, ease: 'linear'    },  // 背景：全程匀速微放大
    angel:  { from: 1.00, to: 3.00, start: 0.00, end: 1.00, ease: 'smoothstep' },  // 神像：和石柱一起启动，smoothstep 更平缓（后段不猛冲，贴脸过程摊薄拉长）
    pillar: { from: 1.00, to: 2.20, start: 0.00, end: 0.80, ease: 'easeInOut' }   // 石柱：缓入缓出让开，跟到 80% 停住
  };

  const els = {};
  for (const name in zoomRange) els[name] = document.getElementById('layer-' + name);

  // ============ 作品卡（横排一字+微 perspective，仿"FALL INTO REVERIE"） ============
  // card-desc 是卡上展示的短描述（约 25~35 字）；full 是点开浮层后的完整描述
  const CARDS = [
    { num: '01', title: '项目案例',  cardDesc: '游戏发行与数据增长全流程：达人筛选、创意内容到投放复盘。',
      full: '负责游戏发行与数据增长：从达人筛选、创意内容制作到投放复盘，全流程跟进。用数据验证方向，不只看曝光，更看点击率与单位效率。' },
    { num: '02', title: '内容创作',  cardDesc: '视频 / 图文 / 文案多形态，紧跟平台热点借势。',
      full: '视频、图文、文案多形态内容创作，紧跟平台热点节奏，打造有传播力的作品。懂得把"产品语言"翻译成"用户语言"。' },
    { num: '03', title: '实习经历',  cardDesc: 'FPS / 二次元 / 模拟经营多品类游戏的 KOL 运营实战。',
      full: '覆盖多品类游戏的 KOL/KOC 运营与达人对接实战，从招募到内容落地全流程参与。理解不同品类用户的内容偏好。' },
    { num: '04', title: '数据复盘',  cardDesc: '投放数据汇总与异常归因：盯着单位效率看，不盯总量。',
      full: '投放数据汇总、异常归因与效果复盘。看点击率与单位效率，而不是曝光总量——曝光能砸钱买，但点击率骗不了人。' },
    { num: '05', title: '达人招募',  cardDesc: 'KOL/KOC 多垂类筛选与对接，统筹渠道供应商资源。',
      full: '精准筛选、挖掘与对接多垂类达人资源，统筹渠道供应商，保障内容稳定输出与档期排布。' },
  ];

  // 横排一字参数：间距大、几乎不旋转、不下垂（参考图是平稳横排+微微 perspective）
  // baseY 决定卡片中心的纵向位置：负值=把卡片从屏幕底部往上抬
  //   -60 → 卡片中心在屏底上方 60px（卡片底伸出屏幕下方约 85px，被任务栏/进度条挡住 → 用户反馈太靠下）
  //   -260 → 卡片中心在屏底上方 260px（卡片整体在屏底上 115px 处完整显示，避让进度条）
  const flat = { spread: 260, tilt: 2.5, baseY: -260 };

  const stage = document.getElementById('cards-stage');
  const cardEls = CARDS.map((c, i) => {
    const idx = i - (CARDS.length - 1) / 2;   // -2,-1,0,1,2（0 是中间，激活态给它 ▶）
    const el = document.createElement('div');
    el.className = 'card' + (idx === 0 ? ' playing' : '');
    el.innerHTML =
      '<div class="card-num">' + c.num + '</div>' +
      '<h3 class="card-title">' + c.title + '</h3>' +
      '<p class="card-desc">' + c.cardDesc + '</p>' +
      '<div class="card-play">▶</div>';
    stage.appendChild(el);
    return { el, idx, data: c };
  });

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function apply(p) {
    for (const name in zoomRange) {
      const r = zoomRange[name];
      // 把全局进度 p 映射到本层局部进度 t（0~1），实现「错峰」错开
      const t = clamp((p - r.start) / (r.end - r.start), 0, 1);
      // 关键：t 再过一条缓动曲线（ease），把"匀速"变成"先慢后快"
      const e = EASING[r.ease || 'linear'](t);
      const s = r.from + (r.to - r.from) * e;

      if (name === 'angel') {
        // 神像段：上浮跟随缓动后的进度（缓入缓出），段尾（e>0.85）轻微淡出
        const dy = -e * 20;
        const op = e < 0.85 ? 1 : 1 - (e - 0.85) * 2;   // 0.85→1.0 时 1→0.7
        els[name].style.opacity = op.toFixed(2);
        els[name].style.transform = 'translateY(' + dy.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';
      } else if (name === 'pillar') {
        // 石柱：跟到 80% 停住，之后才淡出（p>0.80），让神像有足够时间一起推进
        const op = p < 0.80 ? 1 : Math.max(0, 1 - (p - 0.80) * 5);  // 0.80→1.00 时 1→0
        els[name].style.opacity = op.toFixed(2);
        els[name].style.transform = 'scale(' + s.toFixed(3) + ')';
      } else {
        els[name].style.transform = 'scale(' + s.toFixed(3) + ')';
      }
    }

    // 更新进度条 + 阶段文字
    document.getElementById('progress-fill').style.width = (p * 100).toFixed(1) + '%';
    const label = document.getElementById('stage-label');
    if (p < 0.80)      label.textContent = '石柱让开 · 神像同步推进';
    else if (p < 0.90) label.textContent = '贴脸 · 石柱退场';
    else               label.textContent = '贴脸 · 转场';
  }

  // ============ 场景状态机：parallax(推镜) → transition(淡出) → video(视频画面+卡片) ============
  let scene = 'parallax';
  let transitioning = false;
  let cardT = 0;                 // 卡片浮现进度 0~1，独立于 p（转场后才驱动）

  // 卡片浮现：整体淡入 + 横排一字展开（中间微微下垂、两端微微旋转模拟 perspective）
  function setCards(t) {
    const cOp = clamp(t, 0, 1);
    const liftPx = (1 - cOp) * 260;
    for (const { el, idx } of cardEls) {
      // 横排间距：idx * spread, 整体上移 baseY 让卡从下方升上来
      const x = idx * flat.spread * t;
      const y = flat.baseY + liftPx * (1 - t);
      // 微旋转：两端轻歪（±2.5° * idx），给一点 perspective 倾斜感
      const rot = idx * flat.tilt * t;
      el.style.opacity = cOp.toFixed(3);
      el.style.pointerEvents = cOp > 0.5 ? 'auto' : 'none';
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
    }
  }

  // 滚到底 → 视差画面淡出 → 切进视频画面 → 卡片浮现
  function transitionToVideo() {
    if (transitioning) return;
    transitioning = true;
    scene = 'transition';

    // 三层图淡出
    ['bg', 'angel', 'pillar'].forEach(n => {
      const el = document.getElementById('layer-' + n);
      el.style.transition = 'opacity 0.6s ease';
      el.style.opacity = '0';
    });

    // 进度条 + 标签淡出
    const trackEl = document.getElementById('progress-track');
    const labelEl = document.getElementById('stage-label');
    trackEl.style.transition = 'opacity 0.5s ease';
    trackEl.style.opacity = '0';
    labelEl.textContent = '转场 · 进入视频画面';
    labelEl.style.transition = 'opacity 0.5s ease';
    labelEl.style.opacity = '0';

    // 视频场景淡入
    document.getElementById('video-scene').classList.add('show');

    // 0.65s 后进入 video 场景，卡片开始浮现
    setTimeout(() => { scene = 'video'; }, 650);
  }

  // 初始：卡片隐藏
  setCards(0);

  // ============ 驱动方式 ============
  let target = 0;      // 目标进度
  let progress = 0;    // 平滑后的进度（实际渲染用）

  // 方式1：滚轮 —— 直接累加进度，不依赖页面滚动（预览面板里也能用）
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    target = clamp(target + e.deltaY * 0.0005, 0, 1);
  }, { passive: false });

  // 方式2：按住鼠标上下拖 —— 大牌官网那种 scrub 手感（兜底）
  let dragging = false;
  window.addEventListener('mousedown', function () { dragging = true; });
  window.addEventListener('mouseup', function () { dragging = false; });
  window.addEventListener('mouseleave', function () { dragging = false; });
  window.addEventListener('mousemove', function (e) {
    if (dragging) {
      target = clamp(1 - e.clientY / window.innerHeight, 0, 1);
    }
  });

  // 方式3：触屏滑动（手机/平板）
  let touchY = null;
  window.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (touchY !== null) {
      const dy = touchY - e.touches[0].clientY;   // 上滑 = 推进
      target = clamp(target + dy * 0.0010, 0, 1);
      touchY = e.touches[0].clientY;
    }
  }, { passive: true });
  window.addEventListener('touchend', function () { touchY = null; });

  // 进度条：点击/拖动直接跳
  const track = document.getElementById('progress-track');
  function trackFromEvent(e) {
    const rect = track.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / rect.width, 0, 1);
  }
  let trackDragging = false;
  track.addEventListener('mousedown', function (e) {
    trackDragging = true;
    target = trackFromEvent(e);
    e.stopPropagation();
  });
  window.addEventListener('mousemove', function (e) {
    if (trackDragging) target = trackFromEvent(e);
  });
  window.addEventListener('mouseup', function () { trackDragging = false; });

  // ============ 平滑循环 ============
  function loop() {
    progress += (target - progress) * 0.12;
    if (Math.abs(target - progress) < 0.0005) progress = target;

    if (scene === 'parallax' && !transitioning) {
      apply(progress);
      // 滚到底（>=0.999）自动触发转场
      if (progress >= 0.999) transitionToVideo();
    } else if (scene === 'video') {
      // 转场完成后，卡片浮现缓动
      cardT += (1 - cardT) * 0.08;
      if (1 - cardT < 0.001) cardT = 1;
      setCards(cardT);
    }

    requestAnimationFrame(loop);
  }
  loop();

  // ============ 卡片点击 → 详情浮层 ============
  const overlay = document.getElementById('card-overlay');
  const ov = {
    emoji: document.getElementById('ov-emoji'),
    title: document.getElementById('ov-title'),
    tag: document.getElementById('ov-tag'),
    desc: document.getElementById('ov-desc'),
  };
  function openCard(data) {
    ov.emoji.textContent = data.num;
    ov.title.textContent = data.title;
    ov.tag.textContent = 'WORK · 查看详情';
    ov.desc.textContent = data.full;
    overlay.classList.add('show');
  }
  function closeCard() { overlay.classList.remove('show'); }
  cardEls.forEach(({ el, data }) => {
    el.addEventListener('click', () => openCard(data));
  });
  document.getElementById('overlay-close').addEventListener('click', closeCard);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCard(); });
  overlay.addEventListener('mousedown', (e) => e.stopPropagation());   // 避免触发页面拖拽
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });

  // ============ 调试工具：单独开关某层 ============
  const map = { '1': ['bg'], '2': ['angel'], '3': ['pillar'] };
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === '0') {
      Object.values(map).flat().forEach(n => {
        document.getElementById('layer-' + n).style.display = 'block';
      });
    } else if (map[k]) {
      map[k].forEach(n => {
        const el = document.getElementById('layer-' + n);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      });
    }
  });
</script>

</body>
</html>
